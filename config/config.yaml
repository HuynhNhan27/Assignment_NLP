# Project Configuration

# Spacy Model
SPACY_MODEL: "en_core_web_sm"

# Sentence Transformers Model
EMBEDDING_MODEL: "all-MiniLM-L6-v2"

# Entity Normalization Thresholds
FUZZY_THRESHOLD: 0.85
EMBEDDING_THRESHOLD: 0.8

# WSD Parameters
WSD_DEPTH: 5
MIN_CONFIDENCE: 0.5

# Graph Parameters
ENABLE_HIERARCHY_MERGE: true
HIERARCHY_DEPTH: 3

# Output
OUTPUT_FORMAT: "json"
OUTPUT_PATH: "data/output/knowledge_graph.json"


# Modifier Extraction
MODIFIER_CONFIDENCE_THRESHOLD: 0.75
EXTRACT_HIERARCHICAL_MODIFIERS: true
ENABLE_NEGATION_DETECTION: true
ENABLE_TEMPORAL_DETECTION: true

# Graph Construction
CREATE_MODIFIER_NODES: true
INCLUDE_NESTED_MODIFIERS: true